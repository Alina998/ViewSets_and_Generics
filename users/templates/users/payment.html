<!doctype html>

    <title>Создание продукта </title>

<body>
    <h1>Создание продукта</h1>
    <form id="product-form">
        <input type="text" name="name" placeholder="Имя продукта" required>
        <textarea name="description" placeholder="Описание продукта" required></textarea>
        <button type="submit">Создать продукт</button>
    </form>

    <h1>Создание цены</h1>
    <form id="price-form">
        <input type="text" name="amount" placeholder="Сумма в центах" required>
        <input type="text" name="product_id" placeholder="ID продукта" required>
        <button type="submit">Создать цену</button>
    </form>

    <h1>Создание сессии оплаты</h1>
    <form id="checkout-form">
        <input type="text" name="price_id" placeholder="ID цены" required>
        <button type="submit">Создать сессию</button>
    </form>
